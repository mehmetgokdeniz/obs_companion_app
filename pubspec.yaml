name: obs_companion_app
description: "A new Flutter project for university OBS integration."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  obs_core:
    path: packages/obs_core
  http: ^1.6.0
  flutter_local_notifications: ^17.0.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1A0F2B"
  adaptive_icon_foreground: "assets/icon_foreground.png"
